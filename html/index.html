<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Emotes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Custom Emotes</h1>
        <div class="search">
            <input type="text" id="search" placeholder="Search emotes...">
        </div>
        <div class="categories">
            <button class="category" data-category="all">All</button>
            <button class="category" data-category="Dance">Dance</button>
            <button class="category" data-category="Gestures">Gestures</button>
            <button class="category" data-category="Greetings">Greetings</button>
        </div>
        <div class="emotes" id="emotes">
            <!-- Emotes will be loaded here -->
        </div>
        <button id="close">Close</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
